name: Bug report
description: Report a reproducible problem using redacted or synthetic data.
body:
  - type: input
    id: versions
    attributes:
      label: Server, Lexicon, and operating system versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Do not include music files, tokens, or personal library exports.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics and relevant logs
